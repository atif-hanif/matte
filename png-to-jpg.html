<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matte — JPG to PNG</title>
    <link href="assets/vendors/bootstrap/css/bootstrap.min.css" rel="stylesheet">
	<link href="assets/vendors/fontawesome/css/all.css" rel="stylesheet">
    <link href="assets/css/fraunces.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>   

<body>
	<header>
		<nav class="navbar navbar-expand-xl">
			<div class="container align-items-center justify-content-between">
				<button class="btn d-xl-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#demo">
					<i class="fa-solid fa-bars"></i>
				</button>
				<a class="navbar-brand" href="index.html">
					<img src="assets/images/matte-tools-logo.webp" alt="logo" class="header-logo">
				</a>
				<div class="offcanvas offcanvas-start offcanvas-xl" id="demo">
					<div class="offcanvas-header">
						<button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
					</div>
					<div class="offcanvas-body justify-content-center">
						<ul class="navbar-nav">
							<li class="nav-item">
								<a class="nav-link" href="image-tools.html" role="button">
									Image Tools
								</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="#" role="button">
									Document Tools
								</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="#" role="button">
									Video Tools
								</a>
							</li>
						</ul>
					</div>
				</div>
			</div>
		</nav>
	</header>

	<main>
		<div class="container">
			<div id="pjStage" class="stage">
				<div id="pjDropMsg" class="drop-msg">
					<div class="jp-flow">
						<span class="jp-badge">PNG</span>
						<span class="jp-arrow"><i class="fa-solid fa-arrow-right"></i></span>
						<span class="jp-badge is-target">JPG</span>
					</div>
					<div class="big">Drop PNG images here</div>
					<div class="small">or <b>click to browse</b> — select as many as you like</div>
				</div>
			</div>

			<div class="settings-bar show" id="pjSettings">
				<div class="settings-group">
					<label for="pjQuality">Quality</label>
					<input type="range" id="pjQuality" class="pj-range" min="10" max="100" step="1" value="90">
					<output id="pjQualityVal" class="pj-val">90%</output>
				</div>
				<div class="settings-group">
					<label for="pjBg">Fill transparent areas with</label>
					<input type="color" id="pjBg" class="color-input" value="#ffffff">
					<button type="button" class="pj-chip" id="pjBgWhite">White</button>
					<button type="button" class="pj-chip" id="pjBgBlack">Black</button>
				</div>
				<span class="pj-hint">JPG can't be transparent. Changing these re-converts your images.</span>
			</div>

			<div id="pjErr" class="err"></div>

			<div id="pjToolbar" class="toolbar">
				<div class="toolbar-status" id="pjToolbarStatus">Ready</div>
				<div class="toolbar-actions">
					<button type="button" class="btn btn-secondary" id="pjClearBtn">Clear all</button>
					<button type="button" class="btn btn-primary" id="pjDownloadAllBtn" disabled>Download all (.zip)</button>
				</div>
			</div>

			<div id="pjGrid" class="grid"></div>
			
			<input type="file" id="pjFileInput" accept="image/png, .png" multiple>
		</div>
	</main>

	<script src="assets/vendors/bootstrap/js/bootstrap.bundle.js"></script>
	<script type="module" src="assets/js/png-to-jpg.js"> </script>
</body>

</html>
