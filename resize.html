<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matte — Resize & Upscale</title>
    <link href="assets/vendors/bootstrap/css/bootstrap.min.css" rel="stylesheet">
	<link href="assets/vendors/fontawesome/css/all.css" rel="stylesheet">
    <link href="assets/css/fraunces.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>   

<body>
	<header>
		<nav class="navbar navbar-expand-xl">
			<div class="container align-items-center justify-content-between">
				<button class="btn d-xl-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#demo">
					<i class="fa-solid fa-bars"></i>
				</button>
				<a class="navbar-brand" href="index.html">
					<img src="assets/images/matte-tools-logo.webp" alt="logo" class="header-logo">
				</a>
				<div class="offcanvas offcanvas-start offcanvas-xl" id="demo">
					<div class="offcanvas-header">
						<button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
					</div>
					<div class="offcanvas-body justify-content-center">
						<ul class="navbar-nav">
							<li class="nav-item">
								<a class="nav-link" href="image-tools.html" role="button">
									Image Tools
								</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="#" role="button">
									Document Tools
								</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="#" role="button">
									Video Tools
								</a>
							</li>
						</ul>
					</div>
				</div>
			</div>
		</nav>
	</header>
	
	<main>
		<div class="container">
			<div id="rsStage" class="stage">
                <div id="rsDropMsg" class="drop-msg">
                    <div class="big">Drop photos here</div>
                    <div class="small">or <b>click to browse</b> — select as many as you like, JPG/PNG/WEBP</div>
                </div>
            </div>

			<div id="rsErr" class="err"></div>

            <div id="rsSettings" class="settings-bar">
                <div class="settings-group">
                    <label for="rsScale">Scale to</label>
                    <input type="number" id="rsScale" class="scale-input" value="150" min="10" max="800" step="1">
                    <span style="color:var(--muted)">%</span>
                </div>
                <div class="settings-group" id="rsPresets">
                    <button type="button" class="preset-btn" data-scale="50">50%</button>
                    <button type="button" class="preset-btn" data-scale="100">100%</button>
                    <button type="button" class="preset-btn active" data-scale="150">150%</button>
                    <button type="button" class="preset-btn" data-scale="200">200%</button>
                    <button type="button" class="preset-btn" data-scale="400">400%</button>
                </div>
                <label class="ai-toggle" title="Runs a neural network to add plausible detail before resizing. Best for enlarging small images. Slower, and downloads an AI model on first use.">
                    <input type="checkbox" id="rsAiToggle" checked>
                    Enhance with AI when enlarging
                </label>
                <button class="btn btn-orange" id="rsProcessBtn" style="margin-left:auto;">Resize</button>
            </div>

            <div id="rsToolbar" class="toolbar">
                <div class="toolbar-status" id="rsToolbarStatus">Ready</div>
                <div class="toolbar-actions">
                    <button class="btn btn-secondary" id="rsClearBtn">Clear all</button>
                    <button class="btn btn-orange" id="rsDownloadAllBtn" disabled>Download all (.zip)</button>
                </div>
            </div>

            <div id="rsGrid" class="grid"></div>
            <input type="file" id="rsFileInput" accept="image/png, image/jpeg, image/webp" multiple>
		</div>
	</main>

    <script src="assets/vendors/bootstrap/js/bootstrap.bundle.js"></script>
	<script src="assets/vendors/jszip/jszip.min.js"></script>
	<script src="assets/js/resize.js"> </script>
</body>

</html>
