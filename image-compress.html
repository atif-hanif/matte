<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matte — Image Compress</title>
    <link href="assets/vendors/bootstrap/css/bootstrap.min.css" rel="stylesheet">
	<link href="assets/vendors/fontawesome/css/all.css" rel="stylesheet">
    <link href="assets/css/fraunces.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>   

<body>
	<header>
		<nav class="navbar navbar-expand-xl">
			<div class="container align-items-center justify-content-between">
				<button class="btn d-xl-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#demo">
					<i class="fa-solid fa-bars"></i>
				</button>
				<a class="navbar-brand" href="index.html">
					<img src="assets/images/matte-tools-logo.webp" alt="logo" class="header-logo">
				</a>
				<div class="offcanvas offcanvas-start offcanvas-xl" id="demo">
					<div class="offcanvas-header">
						<button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
					</div>
					<div class="offcanvas-body justify-content-center">
						<ul class="navbar-nav">
							<li class="nav-item">
								<a class="nav-link" href="image-tools.html" role="button">
									Image Tools
								</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="#" role="button">
									Document Tools
								</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="#" role="button">
									Video Tools
								</a>
							</li>
						</ul>
					</div>
				</div>
			</div>
		</nav>
	</header>

	<main>
		<div class="container">
			<div id="cmStage" class="stage">
				<div id="cmDropMsg" class="drop-msg">
					<div class="jp-flow">
						<span class="jp-badge">JPG / </span>
						<span class="jp-badge">PNG / </span>
						<span class="jp-badge">WEBP</span>
						<span class="jp-arrow"><i class="fa-solid fa-arrow-right"></i></span>
						<span class="jp-badge is-target">SMALLER</span>
					</div>
					<div class="big">Drop images here</div>
					<div class="small">or <b>click to browse</b> — select as many as you like</div>
				</div>
			</div>

			<div class="settings-bar show" id="cmSettings">
				<div class="settings-group">
					<label for="cmFormat">Save as</label>
					<select id="cmFormat" class="form-select img-convert">
						<option value="original">Keep original format</option>
						<option value="jpeg">JPG</option>
						<option value="webp">WebP</option>
					</select>
				</div>

				<div class="settings-group">
					<label for="cmQuality">Quality</label>
					<input type="range" id="cmQuality" class="pj-range" min="10" max="100" step="1" value="75">
					<output id="cmQualityVal" class="pj-val">75%</output>
				</div>

				<div class="settings-group">
					<label for="cmMax">Largest side</label>
					<select id="cmMax" class="form-select img-convert">
						<option value="0">Original size</option>
						<option value="3840">3840 px</option>
						<option value="2560">2560 px</option>
						<option value="1920">1920 px</option>
						<option value="1280">1280 px</option>
						<option value="1024">1024 px</option>
						<option value="800">800 px</option>
					</select>
				</div>

				<div class="settings-group">
					<label for="cmColors">PNG colors</label>
					<select id="cmColors" class="form-select img-convert">
						<option value="256">256 (best)</option>
						<option value="128">128</option>
						<option value="64">64 (smallest)</option>
						<option value="0">Lossless</option>
					</select>
				</div>
				<span class="pj-hint">Quality applies to JPG and WebP. PNG shrinks by using fewer colors. Images are never enlarged. Changing a setting re-compresses your images.</span>
			</div>

			<div id="cmErr" class="err"></div>

			<div id="cmToolbar" class="toolbar">
				<div class="toolbar-status" id="cmToolbarStatus">Ready</div>
				<div class="toolbar-actions">
					<button type="button" class="btn btn-secondary" id="cmClearBtn">Clear all</button>
					<button type="button" class="btn btn-primary" id="cmDownloadAllBtn" disabled>Download all (.zip)</button>
				</div>
			</div>

			<div id="cmGrid" class="grid"></div>

			<input type="file" id="cmFileInput" accept="image/jpeg, image/png, image/webp, .jpg, .jpeg, .jfif, .png, .webp" multiple>
		</div>
	</main>

	<script src="assets/vendors/bootstrap/js/bootstrap.bundle.js"></script>
	<script src="assets/vendors/jszip/jszip.min.js"></script>
	<script type="module" src="assets/js/image-compress.js"> </script>
</body>

</html>
