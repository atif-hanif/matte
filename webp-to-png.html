<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matte — WebP to PNG</title>
    <link href="assets/vendors/bootstrap/css/bootstrap.min.css" rel="stylesheet">
	<link href="assets/vendors/fontawesome/css/all.css" rel="stylesheet">
    <link href="assets/css/fraunces.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>   

<body>
	<header>
		<nav class="navbar navbar-expand-xl">
			<div class="container align-items-center justify-content-between">
				<button class="btn d-xl-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#demo">
					<i class="fa-solid fa-bars"></i>
				</button>
				<a class="navbar-brand" href="index.html">
					<img src="assets/images/matte-tools-logo.webp" alt="logo" class="header-logo">
				</a>
				<div class="offcanvas offcanvas-start offcanvas-xl" id="demo">
					<div class="offcanvas-header">
						<button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
					</div>
					<div class="offcanvas-body justify-content-center">
						<ul class="navbar-nav">
							<li class="nav-item">
								<a class="nav-link" href="image-tools.html" role="button">
									Image Tools
								</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="#" role="button">
									Document Tools
								</a>
							</li>
							<li class="nav-item">
								<a class="nav-link" href="#" role="button">
									Video Tools
								</a>
							</li>
						</ul>
					</div>
				</div>
			</div>
		</nav>
	</header>

	<main>
		<div class="container">
			<div id="wpStage" class="stage">
				<div id="wpDropMsg" class="drop-msg">
					<div class="jp-flow">
						<span class="jp-badge">WEBP</span>
						<span class="jp-arrow"><i class="fa-solid fa-arrow-right"></i></span>
						<span class="jp-badge is-target">PNG</span>
					</div>
					<div class="big">Drop WebP images here</div>
					<div class="small">or <b>click to browse</b> — select as many as you like</div>
				</div>
			</div>

			<div id="wpErr" class="err"></div>

			<div id="wpToolbar" class="toolbar">
				<div class="toolbar-status" id="wpToolbarStatus">Ready</div>
				<div class="toolbar-actions">
				<button type="button" class="btn btn-ghost" id="wpClearBtn">Clear all</button>
				<button type="button" class="btn btn-primary" id="wpDownloadAllBtn" disabled>Download all (.zip)</button>
				</div>
			</div>

			<div id="wpGrid" class="grid"></div>

			<input type="file" id="wpFileInput" accept="image/webp, .webp" multiple>
		</div>
	</main>

	<script src="assets/vendors/bootstrap/js/bootstrap.bundle.js"></script>
	<script type="module" src="assets/js/webp-to-png.js"> </script>
</body>

</html>
